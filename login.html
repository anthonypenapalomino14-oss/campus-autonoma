<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Virtual</title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="main-container">

    <!-- PANEL IZQUIERDO -->
    <div class="left-section">

        <div class="campus-wrapper">

            <!-- SOLO LA IMAGEN -->
            <img
            src="{{ url_for('static', filename='img/campus.png') }}"
            alt="Campus"
            class="campus-image">

        </div>

    </div>

    <!-- PANEL DERECHO -->
    <div class="right-section">

        <div class="login-container">

            <!-- LOGO -->
            <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            class="top-logo">

         <!-- TITULO -->
<h1 class="titulo-login">
    <span class="bienvenidos">
        Bienvenidos a
    </span>

    <span class="soy-autonoma">
        Soy Autónoma!
        <i class="ti ti-hand-stop icon-hand"></i>
    </span>
</h1>


            <!-- FORM -->
<form action="/registrar" method="POST">

    <!-- USUARIO -->
   <label class="input-label">Usuario</label>



    <input
    type="text"
    name="usuario"
    placeholder="Ingresa tu usuario">

    <!-- PASSWORD -->
    <div class="password-header">

        <label class="input-label">Contraseña</label>

        <a href="#">
            Recuperar contraseña?
        </a>

    </div>

    <div class="password-box">

        <input
        type="password"
        name="password"
        placeholder="••••••••••••"
        id="passwordInput">
      <i class="fa-regular fa-eye-slash" id="togglePassword"></i>

    </div>

    <!-- BOTON -->
    <button type="submit">
        Ingresar
    </button>
            </form>

            <!-- SEPARADOR -->
            <div class="separator">

                <div class="line"></div>

                <span>Con tecnología:</span>

                <div class="line"></div>

            </div>

            <!-- ICONOS -->
            <div class="icons">

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/turnitin.png') }}">
                </div>

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/cube.png') }}">
                </div>

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/vimeo.png') }}">
                </div>

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/zoom.png') }}">
                </div>

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/google.png') }}">
                </div>

                <div class="icon">
                    <img src="{{ url_for('static', filename='img/youtube.png') }}">
                </div>

            </div>

        </div>

    </div>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const passwordInput = document.getElementById("passwordInput");
    const togglePassword = document.getElementById("togglePassword");

    if (!passwordInput || !togglePassword) {
        console.log("No se encontró input o icono");
        return;
    }

    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            this.classList.remove("fa-eye-slash");
            this.classList.add("fa-eye");
        } else {
            passwordInput.type = "password";
            this.classList.remove("fa-eye");
            this.classList.add("fa-eye-slash");
        }

    });

});
</script>
</body>
</html>
